    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <header>
        <div class="header-content">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <div class="logo">gn-math</div>
            </a>
            <div class="search-container">
                <input type="text" id="animeSearchBar" placeholder="Search anime..." oninput="filterAnime()">
                <select id="animeSortOptions" onchange="sortAnime()">
                    <option value="rank">Rank</option>
                    <option value="popularity">Popularity</option>
                    <option value="title">Title</option>
                    <option value="score">Score</option>
                    <option value="year">Year</option>
                    <option value="type">Type</option>
                </select>
                <select id="animeFilterOptions" onchange="filterAnime()">
                    <option value="all">All Types</option>
                    <option value="TV">TV Series</option>
                    <option value="Movie">Movies</option>
                    <option value="OVA">OVA</option>
                    <option value="ONA">ONA</option>
                    <option value="Special">Specials</option>
                    <option value="Music">Music</option>
                </select>
            </div>
            <div class="control-buttons">
                <a href="index.html" class="control-button" title="Back to Games">
                    <img src="refresh-icon.png" alt="games">
                </a>
            </div>
        </div>
    </header>

    <main>
        <div id="animeStats" style="margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
            <span id="animeCount" style="font-size: 14px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
                <span style="width: 4px; height: 4px; border-radius: 50%; background: var(--primary);"></span>
                <span id="animeCountText">Loading...</span>
            </span>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="typeFilters"></div>
        </div>

        <details id="animeSeriesWrapper" open>
            <summary class="section-summary">Anime Series <span id="seriesCount" class="count-badge">0</span></summary>
            <div id="animeSeriesContainer" class="anime-container"></div>
        </details>
        <br><hr><br>
        <details id="animeMoviesWrapper" open>
            <summary class="section-summary">Movies <span id="moviesCount" class="count-badge">0</span></summary>
            <div id="animeMoviesContainer" class="anime-container"></div>
        </details>
        <br><hr><br>
        <details id="animeOvaWrapper" open>
            <summary class="section-summary">OVA/ONA/Specials <span id="ovaCount" class="count-badge">0</span></summary>
            <div id="animeOvaContainer" class="anime-container"></div>
        </details>
    </main>

    <div id="animeModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Title</h3>
                <button id="modalClose" onclick="closeModal()">×</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="index.html">Games</a>
            <a href="anime.html" style="color: var(--primary);">Anime</a>
            <a href="#" onclick="loadDMCA(); return false;">DMCA</a>
            <a href="#" onclick="showContact(); return false;">Contact</a>
            <a href="#" onclick="loadPrivacy(); return false;">Privacy Policy</a>
        </div>
    </footer>
    <script src="anime.js"></script>
    <script>
        const search = new URLSearchParams(window.location.search);
        const privacy = search.get('privacy');
        if (privacy) {
            loadPrivacy();
        }
    </script>
</body>
</html>
