<body>
<div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
  <div class="boot-card"><div class="boot-logo">🍌</div><div class="boot-title">BananaOS</div><div class="boot-subtitle">A little more a-peeling</div><div class="boot-track"><div class="boot-progress"></div></div><div class="boot-status"><span id="boot-message">Waking up the banana brain…</span><span id="boot-percent">0%</span></div><div class="boot-caption">Your desktop will be ready in a moment</div></div>
</div>
<main id="desktop" aria-label="BananaOS desktop" inert>
  <div class="wallpaper-orbit" aria-hidden="true"></div><div class="wallpaper-wordmark" aria-hidden="true">bananaOS<small>A LITTLE MORE A-PEELING</small></div>
  <div class="desktop-icons" id="desktop-icons" aria-label="Desktop applications"></div>
</main>
<div id="start-menu" class="panel hidden" role="dialog" aria-label="Start menu">
  <div class="start-head"><div class="start-logo">🍌</div><div><strong>BananaOS</strong><small>Your delightfully different desktop</small></div></div>
  <input id="start-search" class="start-search" type="search" placeholder="Search apps…" aria-label="Search apps">
  <div id="start-grid" class="start-app-groups"></div>
  <div class="start-foot"><span>BananaOS · Web Edition</span><button id="restart-btn" type="button">↻ Restart desktop</button></div>
</div>
<div id="quick-panel" class="panel hidden" role="dialog" aria-label="Quick settings">
  <div class="quick-title">Quick settings</div>
  <div class="quick-grid">
    <button class="quick-tile" data-toggle="wifi"><span class="qt-icon">◉</span><span class="qt-label">Wi-Fi · <b>On</b></span></button>
    <button class="quick-tile" data-toggle="sound"><span class="qt-icon">♫</span><span class="qt-label">Sounds · <b>On</b></span></button>
    <button class="quick-tile" data-toggle="theme"><span class="qt-icon">◐</span><span class="qt-label">Light theme</span></button>
    <button class="quick-tile" data-toggle="games"><span class="qt-icon">🎮</span><span class="qt-label">Game Center</span></button>
  </div>
  <label class="volume-row"><span>Volume</span><input id="volume-slider" type="range" min="0" max="100" value="35"><span id="volume-value">35%</span></label>
</div>
<footer id="taskbar" inert>
  <button id="start-btn" class="task-btn start-btn" aria-label="Open Start menu" aria-expanded="false"><span class="start-mark">🍌</span><span>Start</span></button>
  <div id="task-apps" aria-label="Open applications"></div>
  <div class="tray">
    <button id="quick-btn" class="tray-btn" aria-label="Quick settings" aria-expanded="false">◉ <span>♫</span></button>
    <button id="clock-btn" class="tray-btn clock-button" aria-label="Date and time"><strong id="clock-time">--:--</strong><span id="clock-date">---</span></button>
  </div>
</footer>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script type="module">
import { appCatalog, appGroups, gameCenter } from "./apps/catalog.js";
import { launchToolApp } from "./apps/toolkit.js";
import { launchGameCenter } from "./apps/game-center.js";
(() => {
  "use strict";
  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) => [...root.querySelectorAll(s)];
  const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[char]));
  const apps = [...appCatalog, gameCenter];
  const defaultDesktopApps = ["browser","terminal","files","notes","calculator","game-center"];
  const state = {
    windows:new Map(), active:null, z:20, audio:null,
    wifi:localStorage.getItem("banana-wifi") !== "off",
    sound:localStorage.getItem("banana-sound") !== "off",
    theme:localStorage.getItem("banana-theme") || "dark",
    volume:Number(localStorage.getItem("banana-volume") ?? 35),
    installed:new Set([...apps.map(app=>app.id),...JSON.parse(localStorage.getItem("banana-installed") || "[]")]),
    desktopApps:JSON.parse(localStorage.getItem("banana-desktop-apps") || JSON.stringify(defaultDesktopApps)),
    desktopPositions:JSON.parse(localStorage.getItem("banana-desktop-positions") || "{}"),
    wallpaper:localStorage.getItem("banana-wallpaper") || "banana",
    accent:localStorage.getItem("banana-accent") || "banana",
    iconSize:localStorage.getItem("banana-icon-size") || "medium",
    files:JSON.parse(localStorage.getItem("banana-files") || '{"welcome.txt":"Welcome to BananaOS!\\n\\nYour 50 browser-based apps run locally in this tab. Open Game Center to browse the bundled UBG catalog."}')
  };
  const desktop = $("#desktop"), desktopIcons = $("#desktop-icons"), startMenu = $("#start-menu"), quickPanel = $("#quick-panel");
  let toastTimer;
  function toast(message) {
    const el = $("#toast"); el.textContent = message; el.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add("hidden"), 2400);
  }
  function beep(kind = "tap") {
    if (!state.sound || state.volume === 0) return;
    try {
      state.audio ||= new (window.AudioContext || window.webkitAudioContext)();
      if (state.audio.state === "suspended") state.audio.resume();
      const oscillator = state.audio.createOscillator(), gain = state.audio.createGain();
      oscillator.type = "sine"; oscillator.frequency.value = kind === "error" ? 185 : kind === "boot" ? 620 : 420;
      gain.gain.setValueAtTime(Math.min(.035, state.volume / 2200), state.audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.0001, state.audio.currentTime + (kind === "boot" ? .2 : .08));
      oscillator.connect(gain); gain.connect(state.audio.destination); oscillator.start(); oscillator.stop(state.audio.currentTime + (kind === "boot" ? .2 : .08));
    } catch (error) { console.warn("Audio feedback is unavailable.", error); }
  }
  function saveSettings() {
    localStorage.setItem("banana-wifi", state.wifi ? "on" : "off");
    localStorage.setItem("banana-sound", state.sound ? "on" : "off");
    localStorage.setItem("banana-theme", state.theme);
    localStorage.setItem("banana-volume", String(state.volume));
    localStorage.setItem("banana-wallpaper",state.wallpaper);
    localStorage.setItem("banana-accent",state.accent);
    localStorage.setItem("banana-icon-size",state.iconSize);
    localStorage.setItem("banana-desktop-apps",JSON.stringify(state.desktopApps));
    localStorage.setItem("banana-desktop-positions",JSON.stringify(state.desktopPositions));
  }
  function updateTray() {
    $("#quick-btn").innerHTML = `${state.wifi ? "◉" : "○"} <span>${state.sound && state.volume ? "♫" : "♩"}</span>`;
    $$(".quick-tile").forEach(tile => {
      const toggle = tile.dataset.toggle;
      tile.classList.toggle("on", toggle === "wifi" ? state.wifi : toggle === "sound" ? state.sound : toggle === "theme" ? state.theme === "light" : false);
      if (toggle === "wifi") $(".qt-label", tile).innerHTML = `Wi-Fi · <b>${state.wifi ? "On" : "Off"}</b>`;
      if (toggle === "sound") $(".qt-label", tile).innerHTML = `Sounds · <b>${state.sound ? "On" : "Off"}</b>`;
      if (toggle === "theme") $(".qt-label", tile).textContent = state.theme === "dark" ? "Light theme" : "Dark theme";
    });
  }
  function applyPersonalization() {
    const wallpapers=["banana","aurora","sunset","ocean"],accents=["banana","mint","sky","orchid"],sizes=["compact","medium","large"];
    if(!wallpapers.includes(state.wallpaper))state.wallpaper="banana";
    if(!accents.includes(state.accent))state.accent="banana";
    if(!sizes.includes(state.iconSize))state.iconSize="medium";
    document.body.dataset.wallpaper=state.wallpaper;
    document.body.dataset.iconSize=state.iconSize;
    document.documentElement.dataset.accent=state.accent;
    renderDesktopIcons();
  }
  function applyTheme() { document.body.classList.toggle("light", state.theme === "light"); applyPersonalization(); updateTray(); }
  function toggleTheme() { state.theme = state.theme === "dark" ? "light" : "dark"; saveSettings(); applyTheme(); }
  function buildStartMenu() {
    const grid = $("#start-grid");
    const categories=[...appGroups,"Games"];
    grid.innerHTML=categories.map(category=>`<section class="start-group"><h2 class="start-section">${escapeHTML(category)}</h2><div class="start-grid">${apps.filter(app=>app.category===category&&state.installed.has(app.id)).map(app=>`<button class="start-app" data-app="${app.id}"><i>${app.icon}</i><span>${escapeHTML(app.name)}</span></button>`).join("")}</div></section>`).join("");
  }
  function renderDesktopIcons() {
    state.desktopApps=state.desktopApps.filter(id=>state.installed.has(id)&&apps.some(app=>app.id===id));
    desktopIcons.innerHTML=apps.filter(app=>state.desktopApps.includes(app.id)).map(app=>{
      const position=state.desktopPositions[app.id]||{};
      const x=Number.isFinite(position.x)?Math.max(-1200,Math.min(1200,position.x)):0;
      const y=Number.isFinite(position.y)?Math.max(-1200,Math.min(1200,position.y)):0;
      return `<button class="desktop-icon" data-app="${app.id}" title="Double-click to open ${escapeHTML(app.name)}" style="transform:translate(${x}px,${y}px)" data-x="${x}" data-y="${y}"><span class="icon-tile">${app.icon}</span><span class="icon-label">${escapeHTML(app.name)}</span></button>`;
    }).join("");
  }
  function focusWindow(id) {
    const win = state.windows.get(id); if (!win) return;
    state.windows.forEach(item => { item.element.classList.remove("active"); item.task.classList.remove("active"); });
    win.element.classList.remove("minimized"); win.element.classList.add("active"); win.task.classList.add("active");
    win.element.style.zIndex = String(++state.z); state.active = id;
  }
  function syncTasks() {
    const area = $("#task-apps"); area.replaceChildren();
    state.windows.forEach(win => {
      const task = document.createElement("button"); task.type = "button"; task.className = "task-app" + (win.element.classList.contains("active") ? " active" : "");
      task.title = win.title; task.innerHTML = `<span>${win.icon}</span><span class="task-name">${escapeHTML(win.title)}</span>`;
      task.addEventListener("click", () => { if (win.element.classList.contains("active")) minimizeWindow(win.id); else focusWindow(win.id); beep(); });
      win.task = task; area.append(task);
    });
  }
  function minimizeWindow(id) {
    const win = state.windows.get(id); if (!win) return;
    win.element.classList.add("minimized"); win.element.classList.remove("active"); win.task.classList.remove("active");
    if (state.active === id) { state.active = null; const next = [...state.windows.values()].find(item => !item.element.classList.contains("minimized")); if (next) focusWindow(next.id); }
  }
  function closeWindow(id) {
    const win = state.windows.get(id); if (!win) return;
    if (win.onClose) win.onClose();
    win.element.style.opacity = "0"; win.element.style.transform = "scale(.98)";
    setTimeout(() => { win.element.remove(); state.windows.delete(id); if (state.active === id) state.active = null; syncTasks(); const next = [...state.windows.values()].find(item => !item.element.classList.contains("minimized")); if (next && !state.active) focusWindow(next.id); }, 140);
    beep();
  }
  function toggleMaximize(win) {
    if (!win.maximized) {
      win.bounds = { left:win.element.style.left, top:win.element.style.top, width:win.element.style.width, height:win.element.style.height };
      win.element.classList.add("maximized"); win.maximized = true;
    } else {
      win.element.classList.remove("maximized"); Object.assign(win.element.style, win.bounds); win.maximized = false;
    }
    focusWindow(win.id);
  }
  function createWindow({id,title,icon="🍌",width=680,height=470,content,onClose=null}) {
    if (state.windows.has(id)) { focusWindow(id); return state.windows.get(id); }
    const win = document.createElement("section"); win.className = "os-window"; win.setAttribute("role","dialog"); win.setAttribute("aria-label",title);
    const availableW = desktop.clientWidth, availableH = desktop.clientHeight;
    const actualW = Math.min(width, Math.max(300, availableW - 20)), actualH = Math.min(height, Math.max(210, availableH - 20));
    const cascade = (state.windows.size * 27) % 165;

  function openCalculator() {
    const container=document.createElement("div");container.className="app";container.style.cssText="max-width:360px;margin:0 auto;padding:18px";
    container.innerHTML=`<input class="app-input calc-display" aria-label="Calculator display" value="0" readonly style="width:100%;text-align:right;font-size:25px;margin-bottom:12px"><div class="calc-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px"></div>`;
    const grid=$(".calc-grid",container);let expression="";
    function evaluate(source) {
      if(source.length>64)throw new Error("Expression too long");
      const tokens=source.match(/(?:\d+\.?\d*|\.\d+|[()+\-*/])/g)||[];
      if(tokens.join("")!==source.replace(/\s/g,"")||tokens.length>64)throw new Error("Invalid expression");
      let index=0;
      function primary(){const token=tokens[index++];if(token==="+")return primary();if(token==="-")return-primary();if(token==="("){const value=additive();if(tokens[index++]!==")")throw new Error("Missing parenthesis");return value;}if(!token||!/^(\d+\.?\d*|\.\d+)$/.test(token))throw new Error("Expected a number");return Number(token);}
      function multiplicative(){let value=primary();while(tokens[index]==="*"||tokens[index]==="/"){const operator=tokens[index++],right=primary();value=operator==="*"?value*right:value/right;}return value;}
      function additive(){let value=multiplicative();while(tokens[index]==="+"||tokens[index]==="-"){const operator=tokens[index++],right=multiplicative();value=operator==="+"?value+right:value-right;}return value;}
      const result=additive();if(index!==tokens.length||!Number.isFinite(result))throw new Error("Invalid result");return result;
    }
    ["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="].forEach(key=>{const button=document.createElement("button");button.className="app-button";button.textContent=key;button.style.cssText="height:45px;font-size:15px";grid.append(button);button.addEventListener("click",()=>{
      const display=$(".calc-display",container);
      if(key==="C"){expression="";display.value="0";return;}
      if(key==="±"){if(expression.startsWith("-"))expression=expression.slice(1);else expression="-"+expression;display.value=expression||"0";return;}
      if(key==="="){try{const result=evaluate(expression);expression=String(Number(result.toFixed(10)));display.value=expression;}catch{display.value="Check expression";expression="";}return;}
      expression+=({"÷":"/","×":"*","−":"-"}[key]||key);display.value=expression;
    });});
    createWindow({id:"calculator",title:"Calculator",icon:"🧮",width:360,height:430,content:container});
  }
  function openCalendar() {
    const container=document.createElement("div");container.className="app calendar";
    container.innerHTML=`<div class="calendar-head"><button class="app-button calendar-prev" aria-label="Previous month">←</button><h2 class="calendar-month"></h2><button class="app-button calendar-next" aria-label="Next month">→</button></div><div class="calendar-grid"></div><div class="calendar-selected"></div>`;
    const grid=$(".calendar-grid",container),heading=$(".calendar-month",container),selected=$(".calendar-selected",container);
    let month=new Date(),selectedDate=new Date();month.setDate(1);
    function render(){
      heading.textContent=month.toLocaleDateString([],{month:"long",year:"numeric"});
      const firstDay=month.getDay(),daysInMonth=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),daysBefore=new Date(month.getFullYear(),month.getMonth(),0).getDate();
      const today=new Date(),sameDay=(a,b)=>a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
      grid.innerHTML=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(day=>`<div class="calendar-day-name">${day}</div>`).join("");
      for(let index=0;index<42;index++){
        let day,offset=0;
        if(index<firstDay){day=daysBefore-firstDay+index+1;offset=-1;}
        else if(index>=firstDay+daysInMonth){day=index-firstDay-daysInMonth+1;offset=1;}
        else day=index-firstDay+1;
        const date=new Date(month.getFullYear(),month.getMonth()+offset,day),button=document.createElement("button");
        button.className="calendar-day"+(offset?" muted-day":"")+(sameDay(date,today)?" today":"")+(sameDay(date,selectedDate)?" selected":"");
        button.type="button";button.textContent=String(day);button.setAttribute("aria-label",date.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric",year:"numeric"}));
        button.addEventListener("click",()=>{selectedDate=date;month=new Date(date.getFullYear(),date.getMonth(),1);render();});
        grid.append(button);
      }
      selected.textContent=`Selected: ${selectedDate.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"})}`;
    }
    $(".calendar-prev",container).addEventListener("click",()=>{month.setMonth(month.getMonth()-1);render();});
    $(".calendar-next",container).addEventListener("click",()=>{month.setMonth(month.getMonth()+1);render();});
    render();createWindow({id:"calendar",title:"Calendar",icon:"🗓️",width:490,height:480,content:container});
  }
  function openPaint() {
    const container=document.createElement("div");container.className="app paint-app";
    container.innerHTML=`<div class="paint-toolbar"><label class="muted">Color <input class="paint-color" type="color" value="#3e633f" aria-label="Brush color"></label><label class="muted">Brush <input class="paint-size" type="range" min="1" max="40" value="7" aria-label="Brush size"></label><button class="app-button paint-clear">Clear</button><button class="app-button primary paint-save">Save PNG</button></div><div class="paint-canvas-wrap"><canvas class="paint-canvas" aria-label="Drawing canvas"></canvas></div>`;
    const canvas=$(".paint-canvas",container),context=canvas.getContext("2d"),wrap=$(".paint-canvas-wrap",container);
    function resizeCanvas(){
      const rect=wrap.getBoundingClientRect();if(!rect.width||!rect.height)return;
      const pixelRatio=Math.min(window.devicePixelRatio||1,2),previous=document.createElement("canvas");
      previous.width=canvas.width;previous.height=canvas.height;
      if(previous.width&&previous.height)previous.getContext("2d").drawImage(canvas,0,0);
      canvas.width=Math.round(rect.width*pixelRatio);canvas.height=Math.round(rect.height*pixelRatio);
      context.setTransform(pixelRatio,0,0,pixelRatio,0,0);context.fillStyle="#fff";context.fillRect(0,0,rect.width,rect.height);
      if(previous.width&&previous.height)context.drawImage(previous,0,0,previous.width,previous.height,0,0,rect.width,rect.height);
      context.lineCap="round";context.lineJoin="round";
    }
    let drawing=false;
    canvas.addEventListener("pointerdown",event=>{drawing=true;canvas.setPointerCapture(event.pointerId);const rect=canvas.getBoundingClientRect();context.beginPath();context.moveTo(event.clientX-rect.left,event.clientY-rect.top);});
    canvas.addEventListener("pointermove",event=>{if(!drawing)return;const rect=canvas.getBoundingClientRect();context.strokeStyle=$(".paint-color",container).value;context.lineWidth=Number($(".paint-size",container).value);context.lineTo(event.clientX-rect.left,event.clientY-rect.top);context.stroke();});
    const stop=()=>{drawing=false;};canvas.addEventListener("pointerup",stop);canvas.addEventListener("pointercancel",stop);
    $(".paint-clear",container).addEventListener("click",()=>{context.save();context.setTransform(1,0,0,1,0,0);context.fillStyle="#fff";context.fillRect(0,0,canvas.width,canvas.height);context.restore();});
    $(".paint-save",container).addEventListener("click",()=>{const link=document.createElement("a");link.download="banana-paint.png";link.href=canvas.toDataURL("image/png");link.click();});
    const observer=new ResizeObserver(resizeCanvas);observer.observe(wrap);
    createWindow({id:"paint",title:"Banana Paint",icon:"🎨",width:720,height:540,content:container,onClose:()=>observer.disconnect()});
    resizeCanvas();
  }
  function openMusic() {
    const container=document.createElement("div");container.className="app music-app";
    container.innerHTML=`<div class="music-disc">🍌</div><h2>Banana Radio</h2><p>A tiny synthesizer, playing locally in your browser.</p><div class="music-controls"><select class="app-select music-tune" aria-label="Choose a tune"><option value="sunshine">Pocket sunshine</option><option value="orbit">Little orbit</option><option value="grove">Grove at dusk</option></select><button class="app-button primary music-toggle">▶ Play</button></div>`;
    const disc=$(".music-disc",container),button=$(".music-toggle",container),tune=$(".music-tune",container);
    const tunes={sunshine:[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46],orbit:[392,523.25,587.33,523.25,349.23,440,523.25,440],grove:[329.63,392,493.88,392,293.66,349.23,440,349.23]};
    let playing=false,noteIndex=0,timer=null;
    function stop(){playing=false;clearTimeout(timer);timer=null;disc.classList.remove("playing");button.textContent="▶ Play";}
    function playNote(){
      if(!playing)return;
      try{
        state.audio ||= new (window.AudioContext||window.webkitAudioContext)();
        if(state.audio.state==="suspended")state.audio.resume();
        const oscillator=state.audio.createOscillator(),gain=state.audio.createGain(),now=state.audio.currentTime;
        oscillator.type="sine";oscillator.frequency.value=tunes[tune.value][noteIndex++%tunes[tune.value].length];
        gain.gain.setValueAtTime(Math.min(.08,state.volume/900),now);gain.gain.exponentialRampToValueAtTime(.0001,now+.24);
        oscillator.connect(gain);gain.connect(state.audio.destination);oscillator.start(now);oscillator.stop(now+.25);
      }catch(error){stop();toast("Audio playback is unavailable in this browser.");console.warn("Music Box audio is unavailable.",error);return;}
      timer=setTimeout(playNote,330);
    }
    button.addEventListener("click",()=>{if(playing){stop();return;}if(!state.sound||state.volume===0){toast("Turn on sound and raise the volume in Settings to listen.");return;}playing=true;disc.classList.add("playing");button.textContent="Ⅱ Pause";playNote();});
    tune.addEventListener("change",()=>{noteIndex=0;});
    createWindow({id:"music",title:"Music Box",icon:"🎵",width:500,height:420,content:container,onClose:stop});
  }

  function runTerminalCommand(line,output,write) {
    const [cmd,...args]=line.trim().split(/\s+/),name=args[0];
    if(cmd==="help")write("Available commands: help, about, apps, date, echo, clear, open <app>\n");
    else if(cmd==="about")write("BananaOS Web Edition · a friendly desktop simulation that runs entirely in your browser.\n");
    else if(cmd==="apps")write(apps.filter(app=>state.installed.has(app.id)).map(app=>app.name).join(" · ")+"\n");
    else if(cmd==="date")write(new Date().toString()+"\n");
    else if(cmd==="echo")write(args.join(" ")+"\n");
    else if(cmd==="clear")output.textContent="";
    else if(cmd==="open"){const app=apps.find(item=>item.id===name||item.name.toLowerCase()===args.join(" ").toLowerCase());if(app&&state.installed.has(app.id)){launch(app.id);write(`Opening ${app.name}…\n`);}else write(`App not found: ${args.join(" ")}\n`);}
    else if(line.trim())write(`Command not found: ${cmd}. Type HELP for available commands.\n`);
  }

  function renderStartSearch() {
    const query=$("#start-search").value.trim().toLowerCase();

  $("#volume-slider").value=String(state.volume);$("#volume-value").textContent=`${state.volume}%`;

  $("#restart-btn").addEventListener("click",()=>window.location.reload());
  $("#desktop").addEventListener("click",event=>{const icon=event.target.closest(".desktop-icon");if(icon&&icon.dataset.app!=="")return;startMenu.classList.add("hidden");quickPanel.classList.add("hidden");});
  let iconDrag=null;
  desktopIcons.addEventListener("pointerdown",event=>{
    const icon=event.target.closest(".desktop-icon");
    if(!icon||event.button!==0)return;
    iconDrag={icon,id:icon.dataset.app,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,x:Number(icon.dataset.x||0),y:Number(icon.dataset.y||0),moved:false};
    icon.setPointerCapture(event.pointerId);
  });
  desktopIcons.addEventListener("pointermove",event=>{
    if(!iconDrag||iconDrag.pointerId!==event.pointerId)return;
    const {icon}=iconDrag,dx=event.clientX-iconDrag.startX,dy=event.clientY-iconDrag.startY;
    if(Math.abs(dx)+Math.abs(dy)>4)iconDrag.moved=true;
    if(!iconDrag.moved)return;
    const minX=-icon.offsetLeft,maxX=desktop.clientWidth-icon.offsetLeft-icon.offsetWidth;
    const minY=-icon.offsetTop,maxY=desktop.clientHeight-icon.offsetTop-icon.offsetHeight;
    const x=Math.max(minX,Math.min(maxX,iconDrag.x+dx)),y=Math.max(minY,Math.min(maxY,iconDrag.y+dy));
    icon.dataset.x=String(x);icon.dataset.y=String(y);icon.style.transform=`translate(${x}px,${y}px)`;
  });
  desktopIcons.addEventListener("pointerup",event=>{
    if(!iconDrag||iconDrag.pointerId!==event.pointerId)return;
    const {icon,id,moved}=iconDrag;
    if(moved){state.desktopPositions[id]={x:Number(icon.dataset.x),y:Number(icon.dataset.y)};saveSettings();}
    if(icon.hasPointerCapture(event.pointerId))icon.releasePointerCapture(event.pointerId);
    iconDrag=null;
  });
  desktopIcons.addEventListener("pointercancel",()=>{iconDrag=null;});
  desktopIcons.addEventListener("dblclick",event=>{const icon=event.target.closest(".desktop-icon");if(icon)launch(icon.dataset.app);});
  desktopIcons.addEventListener("keydown",event=>{const icon=event.target.closest(".desktop-icon");if(icon&&(event.key==="Enter"||event.key===" ")){event.preventDefault();launch(icon.dataset.app);}});
  document.addEventListener("pointerdown",event=>{if(!startMenu.contains(event.target)&&!$("#start-btn").contains(event.target)){startMenu.classList.add("hidden");$("#start-btn").classList.remove("selected");}if(!quickPanel.contains(event.target)&&!$("#quick-btn").contains(event.target)){quickPanel.classList.add("hidden");$("#quick-btn").classList.remove("selected");}});
  document.addEventListener("keydown",event=>{if(event.key==="Escape"){startMenu.classList.add("hidden");quickPanel.classList.add("hidden");}});
  function updateClock(){const now=new Date();$("#clock-time").textContent=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});$("#clock-date").textContent=now.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});}
  updateClock();setInterval(updateClock,15000);applyTheme();buildStartMenu();updateTray();
  async function runBootSequence(){
    const stages=["Loading kernel…","Mounting virtual file system…","Loading 50 app modules…","Indexing the local game library…","Initializing Gust Browser…","Starting desktop services…"];
    const progress=$(".boot-progress"),message=$("#boot-message"),percent=$("#boot-percent");
    for(let index=0;index<stages.length;index++){
      message.textContent=stages[index];
      const value=Math.round((index+1)/stages.length*100);
      progress.style.transform=`scaleX(${value/100})`;
      percent.textContent=`${value}%`;
      await new Promise(resolve=>setTimeout(resolve,1000));
    }
    await Promise.all([document.fonts?.ready||Promise.resolve(),new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))]);
    message.textContent="Ready. Have a-peeling day!";
    $("#desktop").removeAttribute("inert");$("#taskbar").removeAttribute("inert");beep("boot");
    $("#boot-screen").classList.add("finished");
    setTimeout(()=>{$("#boot-screen").remove();toast("Welcome to BananaOS. Double-click an app to get started!");},600);
  }
  runBootSequence();
})();
